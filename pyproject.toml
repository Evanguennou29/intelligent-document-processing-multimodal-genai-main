[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idp-multimodal-genai"
version = "2.0.0"
description = "Multimodal Intelligent Document Processing: OCR + LLM structured extraction with hybrid cloud/local orchestration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Evan Guennou", email = "evan.guennou2@gmail.com" }]
keywords = ["ocr", "document-processing", "llm", "gemini", "ollama", "streamlit", "pydantic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.31"]
vertex = [
    "google-cloud-aiplatform>=1.38",
    "google-generativeai>=0.5",
    "google-cloud-vision>=3.5",
]
ollama = ["ollama>=0.2"]
pdf = ["pymupdf>=1.24"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
all = [
    "streamlit>=1.31",
    "google-cloud-aiplatform>=1.38",
    "google-generativeai>=0.5",
    "google-cloud-vision>=3.5",
    "ollama>=0.2",
    "pymupdf>=1.24",
]

[project.urls]
Homepage = "https://github.com/Evanguennou29/intelligent-document-processing-multimodal-genai-main"
Repository = "https://github.com/Evanguennou29/intelligent-document-processing-multimodal-genai-main"
Issues = "https://github.com/Evanguennou29/intelligent-document-processing-multimodal-genai-main/issues"

[project.scripts]
idp = "idp.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "build", "dist", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP037"]
